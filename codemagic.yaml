workflows:
  android-apk:
    name: Foco TDAH Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Prepare Android project
        script: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.christyanengeco .; fi
          cat > test/widget_test.dart << 'EOF'
          import 'package:flutter/material.dart';
          import 'package:flutter_test/flutter_test.dart';

          void main() {
            testWidgets('smoke test', (tester) async {
              await tester.pumpWidget(const SizedBox());
            });
          }
          EOF
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
