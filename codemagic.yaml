workflows:
  android-workflow:
    name: Android Test Build
    instance_type: mac_mini_m1
    max_build_duration: 30

    environment:
      flutter: stable

    scripts:
      - name: Instalar dependencias
        script: |
          flutter pub get

      - name: Gerar estrutura Android e configurar
        script: |
          flutter create --platforms=android .

          python3 << 'EOF'
          from pathlib import Path

          gradle = Path("android/app/build.gradle.kts")
          text = gradle.read_text()

          if "isCoreLibraryDesugaringEnabled" not in text:
              text = text.replace(
                  "compileOptions {",
                  "compileOptions {\n        isCoreLibraryDesugaringEnabled = true"
              )

          if "coreLibraryDesugaring(" not in text:
              if "dependencies {" in text:
                  text = text.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
                  )
              else:
                  text += """

          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")
          }
          """

          gradle.write_text(text)

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          xml = manifest.read_text()

          permissions = [
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.SCHEDULE_EXACT_ALARM",
              "android.permission.USE_FULL_SCREEN_INTENT",
          ]

          for p in permissions:
              if p not in xml:
                  xml = xml.replace(
                      "<application",
                      f'<uses-permission android:name="{p}"/>\n\n    <application',
                      1
                  )

          manifest.write_text(xml)
          EOF

      - name: Compilar APK de Teste
        script: |
          flutter build apk --debug

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
