workflows:
  android-apk:
    name: Foco TDAH Android APK
    instance_type: linux_x2
    max_build_duration: 30
    environment:
      flutter: stable
      java: 17
    scripts:
      - name: Prepare Android project
        script: |
          if [ ! -d android ]; then flutter create --platforms=android --org com.christyanengeco .; fi
      - name: Get packages
        script: flutter pub get
      - name: Analyze
        script: flutter analyze
      - name: Build APK
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
